packages:
  - apps/*
  - packages/*

# One version of each shared dependency for every app and package (referenced as "catalog:").
catalog:
  "@hookform/resolvers": ^5.9.1
  "@playwright/test": ~1.64.0
  "@tailwindcss/turbopack": ^4
  "@testing-library/dom": ^10.4.2
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ~16.3.3
  "@testing-library/user-event": ^14.6.7
  "@types/node": ^24.19.2
  "@types/react": ^19
  "@types/react-dom": ^19
  "@vitejs/plugin-react": ^6.1.2
  "@vitest/coverage-v8": ~5.0.4
  bcryptjs: ~3.0.2
  clsx: ^2.1.1
  eslint: ^9
  eslint-config-next: 16.4.0
  jose: ~6.2.12
  jsdom: ^30.1.2
  lucide-react: ^1.55.0
  mongodb-memory-server: ~11.3.0
  mongoose: ~9.11.1
  next: 16.4.0
  prettier: ~3.9.10
  prettier-plugin-tailwindcss: ^0.8.1
  react: 19.3.0
  react-dom: 19.3.0
  react-hook-form: ^7.89.0
  swiper: ^14.3.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4
  tsx: ^4.23.15
  turbo: ^2.11.7
  typescript: ^5
  vite: ^8.3.4
  vitest: ~5.0.4
  zod: ^4.6.5
  zustand: ^5.0.15

allowBuilds:
  # Needed: verifies/places the native esbuild binary used by tsx and Vite.
  esbuild: true
  # Not needed at install: it only pre-downloads mongod, which happens on the first integration test run.
  mongodb-memory-server: false
  # Not needed: the native binding comes from its optional platform package.
  unrs-resolver: false

minimumReleaseAgeExclude:
  - "@vitest/coverage-v8@5.0.4"
  - "@vitest/mocker@5.0.4"
  - "@vitest/spy@5.0.4"
  - vitest@5.0.4
