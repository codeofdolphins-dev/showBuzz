openapi: 3.1.0
info:
  title: ShowBuzz API
  version: 0.1.0
  description: |
    REST API under /api/v1. Every response uses the envelope from CLAUDE.md §7:
    `{ success: true, data, meta? }` or `{ success: false, error: { code, message, details? } }`.
    Responses carry `x-request-id` and `Cache-Control: no-store` unless stated otherwise.
    State-changing endpoints require a same-origin `Origin` (or `Referer`) header (403 otherwise).
servers:
  - url: /api/v1

tags:
  - name: Customer auth
    description: Phone/email one-time-code sign-in and cookie sessions.
  - name: Staff auth
    description: Admin console (admin.showbuzz.com) email + password sign-in and cookie sessions.
  - name: Partner auth
    description: Partner portal (partner.showbuzz.com) vendor email + password sign-in and cookie sessions.
  - name: Partner
    description: Partner portal resources, always scoped to the signed-in vendor.
  - name: Internal
    description: Server-to-server calls between the ShowBuzz apps (not for browsers).
  - name: System

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness and database reachability
      responses:
        "200":
          description: Database reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthEnvelope" }
        "503":
          description: Database unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthEnvelope" }

  /auth/customer/otp/request:
    post:
      tags: [Customer auth]
      summary: Send a sign-in code
      description: |
        Same response whether or not an account exists. Rate limits: 20/hour per IP,
        1 per 30 s and 5/hour per phone or email. `devCode` is only returned outside production.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier:
                  type: string
                  description: Indian mobile number (any common format) or email address.
                  examples: ["98765 43210", "aarav@example.com"]
                name:
                  type: string
                  minLength: 2
                  maxLength: 80
                  description: Used if verification creates the account.
      responses:
        "200":
          description: Code sent.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/OtpChallenge" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/customer/otp/verify:
    post:
      tags: [Customer auth]
      summary: Verify a code and start a session
      description: |
        Creates the account on first sign-in. Sets the access and refresh cookies.
        Rate limit: 30 attempts per 10 min per IP; 5 attempts per code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId: { type: string, pattern: "^[0-9a-f]{24}$" }
                code: { type: string, pattern: "^\\d{6}$" }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookies" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionEnvelope" }
        "401":
          description: Wrong code (`OTP_INVALID`, with `details.remainingAttempts`) or account unavailable (`UNAUTHENTICATED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "410":
          description: Code expired, replaced by a newer one, or already used (`OTP_EXPIRED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/refresh:
    post:
      tags: [Customer auth]
      summary: Rotate the session (client-side refresh)
      description: |
        Uses the refresh cookie (path /api/v1/auth). Rotates both cookies. Replaying an old refresh
        token more than 10 s after rotation revokes the session.
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Session renewed.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookies" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionEnvelope" }
        "401":
          description: Missing, expired, revoked or reused refresh token. Both cookies are cleared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [Customer auth]
      summary: Rotate the session during a page navigation
      description: Used by proxy.ts. Always answers with a 303 to a local path.
      security:
        - refreshCookie: []
      parameters:
        - name: next
          in: query
          required: false
          description: Local path to return to. Anything that isn't a single-slash relative path becomes "/".
          schema: { type: string, maxLength: 512 }
      responses:
        "303":
          description: |
            Success: redirect to `next` with fresh cookies.
            Failure: cookies cleared and redirect to `/?auth=signin&next=<path>`.
          headers:
            Location: { schema: { type: string } }
            Set-Cookie: { $ref: "#/components/headers/SessionCookies" }

  /auth/logout:
    post:
      tags: [Customer auth]
      summary: Sign out this device
      description: Revokes the current session if a valid token is present and clears both cookies. Idempotent.
      responses:
        "200":
          description: Signed out (also when already signed out).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          signedOut: { type: boolean, const: true }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/me:
    get:
      tags: [Customer auth]
      summary: The signed-in customer
      description: Requires a valid access cookie whose session is still active. Cookies are not cleared on 401.
      security:
        - accessCookie: []
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /admin/auth/login:
    post:
      tags: [Staff auth]
      summary: Staff sign-in (email + password)
      description: |
        Served by the admin app. Wrong email, wrong password and disabled accounts all answer 401
        "Invalid email or password.". Limited to 5 attempts per email and 20 per IP per 15 minutes.
        Sets the staff cookies (sba_*), never the customer ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/StaffSessionCookies" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSessionEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/auth/refresh:
    post:
      tags: [Staff auth]
      summary: Rotate the staff session
      description: Uses the staff refresh cookie (path /api/v1/admin/auth). A replayed old token revokes the session.
      security: [{ staffRefreshCookie: [] }]
      responses:
        "200":
          description: New token pair.
          headers:
            Set-Cookie: { $ref: "#/components/headers/StaffSessionCookies" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSessionEnvelope" }
        "401":
          description: Session ended; staff cookies are cleared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [Staff auth]
      summary: Rotate and redirect (page navigations from proxy.ts)
      security: [{ staffRefreshCookie: [] }]
      parameters:
        - name: next
          in: query
          schema: { type: string }
          description: Local path to return to; anything else falls back to /dashboard.
      responses:
        "303":
          description: To `next` with new cookies, or to /login?next= with cleared cookies.
  /admin/auth/logout:
    post:
      tags: [Staff auth]
      summary: End this device's staff session
      responses:
        "200":
          description: Signed out (idempotent); staff cookies cleared.
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/auth/me:
    get:
      tags: [Staff auth]
      summary: The signed-in staff member, role and permissions
      description: Customer tokens never verify here (different audience and keys).
      security: [{ staffAccessCookie: [] }]
      responses:
        "200":
          description: Current staff member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSessionEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /partner/auth/login:
    post:
      tags: [Partner auth]
      summary: Vendor sign-in (email + password)
      description: |
        Served by the partner app. Same rules as staff sign-in: wrong email, wrong password and disabled logins all
        answer 401 "Invalid email or password."; 5 attempts per email and 20 per IP per 15 minutes. A suspended
        vendor can sign in (the portal shows a notice and refuses listing changes). Sets the partner cookies (sbp_*).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/PartnerSessionCookies" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerLoginEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /partner/auth/refresh:
    post:
      tags: [Partner auth]
      summary: Rotate the vendor session
      description: Uses the partner refresh cookie (path /api/v1/partner/auth). A replayed old token revokes the session.
      security: [{ partnerRefreshCookie: [] }]
      responses:
        "200":
          description: New token pair.
          headers:
            Set-Cookie: { $ref: "#/components/headers/PartnerSessionCookies" }
        "401":
          description: Session ended; partner cookies are cleared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [Partner auth]
      summary: Rotate and redirect (page navigations from proxy.ts)
      security: [{ partnerRefreshCookie: [] }]
      parameters:
        - name: next
          in: query
          schema: { type: string }
          description: Local path to return to; anything else falls back to /dashboard.
      responses:
        "303":
          description: To `next` with new cookies, or to /login?next= with cleared cookies.
  /partner/auth/logout:
    post:
      tags: [Partner auth]
      summary: End this device's vendor session
      responses:
        "200":
          description: Signed out (idempotent); partner cookies cleared.
        "403": { $ref: "#/components/responses/Forbidden" }
  /partner/auth/me:
    get:
      tags: [Partner auth]
      summary: The signed-in vendor user and their vendor
      description: Customer and staff tokens never verify here (different audience and keys). Bank account masked.
      security: [{ partnerAccessCookie: [] }]
      responses:
        "200":
          description: Current vendor user and vendor summary.
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /partner/documents/{fileId}:
    get:
      tags: [Partner]
      summary: One of the signed-in vendor's own KYC documents
      description: |
        Streams the file inline (PDF, JPEG or PNG; `Cache-Control: private, no-store`). A file that belongs to
        another vendor, or is no longer on this vendor's KYC, answers 404 like a missing one.
      security: [{ partnerAccessCookie: [] }]
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{24}$" }
      responses:
        "200":
          description: The file.
          content:
            application/pdf: {}
            image/jpeg: {}
            image/png: {}
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found (`NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /admin/vendors/{vendorId}/documents/{fileId}:
    get:
      tags: [Admin]
      summary: A vendor's KYC document, for staff (admin app)
      description: |
        Served by the admin app. Needs the `organisers:read` permission. Streams the file inline (PDF, JPEG or PNG;
        `Cache-Control: private, no-store`). A file not listed on that vendor's KYC, or owned by another vendor,
        answers 404.
      security: [{ staffAccessCookie: [] }]
      parameters:
        - name: vendorId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{24}$" }
        - name: fileId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{24}$" }
      responses:
        "200":
          description: The file.
          content:
            application/pdf: {}
            image/jpeg: {}
            image/png: {}
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Not found (`NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /internal/revalidate:
    servers:
      - url: /api
    post:
      tags: [Internal]
      summary: Refresh the public site's cached catalogue
      description: |
        Served by the public app at /api/internal/revalidate. Called by the admin and partner apps
        (`revalidateWeb(tags)`) after an edit; marks the given catalogue cache tags stale. Requires
        `Authorization: Bearer <REVALIDATE_SECRET>` (compared in constant time); no cookies, no origin check.
      security: [{ internalBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
                    enum:
                      - catalog:cities
                      - catalog:movies
                      - catalog:venues
                      - catalog:events
                      - catalog:stream-titles
                      - catalog:coupons
                      - catalog:food-items
                      - catalog:gift-card-designs
                      - catalog:shows
                      - catalog:vendors
      responses:
        "200":
          description: Tags revalidated (`data.revalidated`).
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: __Host-sb_at
      description: Access JWT (15 min). Named `sb_at` outside production.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-sb_rt
      description: Refresh JWT (7 days, sliding), sent only to /api/v1/auth. Named `sb_rt` outside production.

    staffAccessCookie:
      type: apiKey
      in: cookie
      name: __Host-sba_at
      description: Staff access JWT (15 min, aud showbuzz-admin). Named `sba_at` outside production.
    staffRefreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-sba_rt
      description: Staff refresh JWT (7 days, sliding), sent only to /api/v1/admin/auth. Named `sba_rt` outside production.

    partnerAccessCookie:
      type: apiKey
      in: cookie
      name: __Host-sbp_at
      description: Vendor-user access JWT (15 min, aud showbuzz-partner). Named `sbp_at` outside production.
    partnerRefreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-sbp_rt
      description: Vendor-user refresh JWT (7 days, sliding), sent only to /api/v1/partner/auth. Named `sbp_rt` outside production.
    internalBearer:
      type: http
      scheme: bearer
      description: The shared REVALIDATE_SECRET (server-to-server only).

  headers:
    SessionCookies:
      description: |
        `__Host-sb_at` (Path=/; Max-Age=900) and `__Secure-sb_rt` (Path=/api/v1/auth; Max-Age=604800),
        plus `__Host-sb_has_session=1` (Path=/; Max-Age=604800, no secret: tells pages a session exists so the
        client can refresh silently). All HttpOnly; Secure; SameSite=Lax. Cleared with Max-Age=0.
      schema: { type: string }

    StaffSessionCookies:
      description: |
        `__Host-sba_at` (Path=/; Max-Age=900), `__Secure-sba_rt` (Path=/api/v1/admin/auth; Max-Age=604800) and
        `__Host-sba_has_session=1`. All HttpOnly; Secure; SameSite=Lax; host-only (no Domain attribute).
      schema: { type: string }

    PartnerSessionCookies:
      description: |
        `__Host-sbp_at` (Path=/; Max-Age=900), `__Secure-sbp_rt` (Path=/api/v1/partner/auth; Max-Age=604800) and
        `__Host-sbp_has_session=1`. All HttpOnly; Secure; SameSite=Lax; host-only (no Domain attribute).
      schema: { type: string }

  responses:
    Forbidden:
      description: Cross-origin request (`FORBIDDEN`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthenticated:
      description: Not signed in or session ended (`UNAUTHENTICATED`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ValidationFailed:
      description: Invalid input (`VALIDATION_FAILED`, with `details.fieldErrors`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Too many requests (`RATE_LIMITED`, with `details.retryAfterSec`).
      headers:
        Retry-After:
          description: Seconds until the limit resets.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: {}
        meta:
          type: object
          description: Lists only.
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
              description: Safe to show to the customer.
            details:
              type: object
              description: Client-safe extras, e.g. `fieldErrors`, `retryAfterSec`, `remainingAttempts`.
              additionalProperties: true

    ErrorCode:
      type: string
      enum:
        - NOT_FOUND
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - CONFLICT
        - SEAT_UNAVAILABLE
        - COUPON_INVALID
        - BOOKING_NOT_CANCELLABLE
        - OTP_INVALID
        - OTP_EXPIRED
        - RATE_LIMITED
        - NOT_CONFIGURED
        - STEP_UP_REQUIRED
        - VENDOR_SUSPENDED
        - ONBOARDING_INCOMPLETE
        - INTERNAL

    CustomerSnapshot:
      type: object
      required: [id, name, joinedAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, pattern: "^\\+91[6-9]\\d{9}$", description: E.164 }
        joinedAt: { type: string, format: date-time }

    OtpChallenge:
      type: object
      required: [challengeId, destination, expiresInSec, resendAfterSec]
      properties:
        challengeId: { type: string }
        destination: { type: string, description: 'Masked, e.g. "98******10" or "a***@example.com".' }
        expiresInSec: { type: integer, examples: [300] }
        resendAfterSec: { type: integer, examples: [30] }
        devCode: { type: string, description: Outside production only. }

    SessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: object
              required: [user, accessExpiresAt]
              properties:
                user: { $ref: "#/components/schemas/CustomerSnapshot" }
                accessExpiresAt: { type: string, format: date-time }

    HealthEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: object
              properties:
                status: { type: string, enum: [ok, degraded] }
                db: { type: string, enum: [up, down] }

    StaffSnapshot:
      type: object
      required: [id, name, email, role, permissions]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role:
          type: object
          properties:
            id: { type: string }
            name: { type: string, examples: [Super Admin] }
        permissions:
          type: array
          items: { type: string, examples: ["movies:read"] }
        lastLoginAt: { type: string, format: date-time }

    StaffSessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: object
              required: [staff, accessExpiresAt]
              properties:
                staff: { $ref: "#/components/schemas/StaffSnapshot" }
                accessExpiresAt: { type: string, format: date-time }

    VendorUserSnapshot:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [owner] }
        lastLoginAt: { type: string, format: date-time }

    PartnerLoginEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: object
              required: [vendorUser, vendor, accessExpiresAt]
              properties:
                vendorUser: { $ref: "#/components/schemas/VendorUserSnapshot" }
                vendor:
                  type: object
                  properties:
                    id: { type: string }
                    businessName: { type: string }
                    onboardingStatus: { type: string, enum: [incomplete, complete] }
                accessExpiresAt: { type: string, format: date-time }
